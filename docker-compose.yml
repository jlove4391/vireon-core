services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # POSTGRES_USER is the Postgres bootstrap superuser (initdb makes it
      # a cluster superuser, which unconditionally bypasses row-level
      # security). It is intentionally NOT the role DATABASE_URL connects
      # as. docker/init/01-bootstrap-app-role.sql runs as this bootstrap
      # user on first init and creates the non-superuser `vireon` role
      # that the application actually uses -- see that file for why.
      POSTGRES_USER: postgres_bootstrap
      POSTGRES_PASSWORD: postgres_bootstrap
      POSTGRES_DB: vireon_core
    ports:
      - "5432:5432"
    volumes:
      - vireon_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_bootstrap -d vireon_core"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vireon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # PR 0: optional OTLP trace destination for local dev. Not part of
  # ordinary `docker compose up` -- opt in with
  # `docker compose --profile observability up -d`. Backend-neutral
  # instrumentation (src/telemetry/tracing.ts) means this can be swapped for
  # any other OTLP collector without touching application code.
  #
  # Self-hosted under Elastic License 2.0 -- internal operation by Vireon
  # engineers, not exposed to third parties, does not trigger the license's
  # hosted/managed-service restriction. See docs/adr/0006-observability-foundation.md.
  #
  # SQLite backend (no PHOENIX_SQL_DATABASE_URL set), persisted to its own
  # volume -- Phoenix manages its own storage entirely and must never share
  # vireon_postgres_data. Pinned concrete tag, non-root image variant,
  # telemetry/external-resource fetching both disabled.
  #
  # A fresh named Docker volume is created root-owned; the nonroot image
  # runs as uid 65532 and cannot write to it as-is. phoenix-init is a
  # one-shot chown, gated by service_completed_successfully so it always
  # runs to completion (root-owned volume -> uid 65532) before phoenix
  # itself starts -- not a root-user workaround for phoenix's own process.
  phoenix-init:
    image: busybox:1.36
    profiles: ["observability"]
    command: ["chown", "-R", "65532:65532", "/mnt/data"]
    volumes:
      - vireon_phoenix_data:/mnt/data
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:version-19.13.0-nonroot
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      phoenix-init:
        condition: service_completed_successfully
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "6006:6006" # Phoenix UI + OTLP/HTTP (/v1/traces)
      - "4317:4317" # OTLP/gRPC collector
    volumes:
      - vireon_phoenix_data:/mnt/data

volumes:
  vireon_postgres_data:
  vireon_redis_data:
  vireon_phoenix_data:
